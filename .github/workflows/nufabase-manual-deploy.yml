name: Nufabase — Manual Deploy (Firebase)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Target Firebase Hosting channel"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - preview
      preview_expires:
        description: "Masa berlaku preview channel (hanya jika channel=preview)"
        required: false
        default: "7d"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets ke index.html
        run: |
          sed -i "s|%%FIREBASE_API_KEY%%|${{ secrets.FIREBASE_API_KEY }}|g"           index.html
          sed -i "s|%%FIREBASE_DATABASE_URL%%|${{ secrets.FIREBASE_DATABASE_URL }}|g" index.html
          sed -i "s|%%ACCESS_CODE_B64%%|${{ secrets.ACCESS_CODE_B64 }}|g"             index.html
          sed -i "s|%%NOTIFY_SECRET%%|${{ secrets.NOTIFY_SECRET }}|g"                 index.html

      - name: Inject secrets ke dashmin.html
        run: |
          sed -i "s|%%FIREBASE_API_KEY%%|${{ secrets.FIREBASE_API_KEY }}|g" dashmin.html

      - name: Inject secrets ke assets/logic (gallery.js & notify-throttle.js)
        run: |
          sed -i "s|%%ACCESS_CODE_B64%%|${{ secrets.ACCESS_CODE_B64 }}|g" assets/logic/gallery.js
          sed -i "s|%%NOTIFY_SECRET%%|${{ secrets.NOTIFY_SECRET }}|g"     assets/logic/notify-throttle.js

      - name: Deploy — live (hosting:nufabase)
        if: ${{ inputs.channel == 'live' }}
        run: npx firebase-tools deploy --only hosting:nufabase --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy — preview channel (hosting:nufabase)
        if: ${{ inputs.channel == 'preview' }}
        run: npx firebase-tools hosting:channel:deploy manual-preview --only nufabase --expires ${{ inputs.preview_expires }} --token "${{ secrets.FIREBASE_TOKEN }}"
