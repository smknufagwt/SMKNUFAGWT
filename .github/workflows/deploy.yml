name: Nufa Chat — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets ke index.html
        run: |
          sed -i "s|%%FIREBASE_API_KEY%%|${{ secrets.FIREBASE_API_KEY }}|g"           index.html
          sed -i "s|%%FIREBASE_DATABASE_URL%%|${{ secrets.FIREBASE_DATABASE_URL }}|g" index.html
          sed -i "s|%%ACCESS_CODE_B64%%|${{ secrets.ACCESS_CODE_B64 }}|g"             index.html
          sed -i "s|%%NOTIFY_SECRET%%|${{ secrets.NOTIFY_SECRET }}|g"                 index.html

      - name: Deploy ke Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     team_WAxjsLFh79gZzZGqIxczIcz8
          vercel-project-id: prj_gCEeSO4IqIbjEs0oK99EyRIORx8A
          vercel-args:       '--prod'
