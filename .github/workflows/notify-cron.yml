name: Nufa Chat — Notify Cron

on:
  schedule:
    # Setiap 2 menit (minimum GitHub Actions = 5 menit per spec,
    # tapi kita pakai 2 job staggered untuk simulasi ~2 menit)
    - cron: '*/11 * * * *'
  workflow_dispatch: # Bisa trigger manual dari GitHub

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check Firestore & trigger notify
        env:
          FIREBASE_API_KEY:        ${{ secrets.FIREBASE_API_KEY }}
          ONESIGNAL_REST_API_KEY:  ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NOTIFY_SECRET:           ${{ secrets.NOTIFY_SECRET }}
          FIREBASE_PROJECT_ID:     server-nufa
          VERCEL_NOTIFY_URL:       ${{ secrets.VERCEL_NOTIFY_URL }}
        run: |
          node << 'EOF'
          const https = require('https');

          const PROJECT_ID  = process.env.FIREBASE_PROJECT_ID;
          const API_KEY     = process.env.FIREBASE_API_KEY;
          const NOTIFY_URL  = process.env.VERCEL_NOTIFY_URL;
          const SECRET      = process.env.NOTIFY_SECRET;

          // Waktu sekarang minus 5 menit (window pengecekan)
          // Pakai 5 menit karena cron minimal 5 menit
          const since = Date.now() - (5 * 60 * 1000 + 10000); // +10 detik buffer

          function httpsRequest(url, options, body) {
            return new Promise((resolve, reject) => {
              const req = https.request(url, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }

          async function main() {
            // Query Firestore REST: ambil pesan terbaru (orderBy ts desc, limit 1)
            const fsUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:runQuery?key=${API_KEY}`;
            
            const query = {
              structuredQuery: {
                from: [{ collectionId: 'global_chat' }],
                orderBy: [{ field: { fieldPath: 'ts' }, direction: 'DESCENDING' }],
                limit: 1,
              }
            };

            const fsRes = await httpsRequest(
              fsUrl,
              { method: 'POST', headers: { 'Content-Type': 'application/json' } },
              JSON.stringify(query)
            );

            if (fsRes.status !== 200) {
              console.error('Firestore query gagal:', fsRes.status, JSON.stringify(fsRes.body));
              process.exit(0); // Jangan fail workflow
            }

            const results = fsRes.body;
            if (!results[0] || !results[0].document) {
              console.log('Tidak ada pesan di Firestore.');
              process.exit(0);
            }

            const fields = results[0].document.fields;
            const msgTs  = parseInt(fields.ts?.integerValue || fields.ts?.doubleValue || '0');
            const msgIp  = fields.ip?.stringValue  || 'Anonim';
            const msgText = fields.text?.stringValue || '';

            console.log(`Pesan terakhir: ts=${msgTs}, since=${since}, diff=${msgTs - since}ms`);

            // Jika pesan lebih lama dari window → tidak ada yang baru
            if (msgTs < since) {
              console.log('Tidak ada pesan baru dalam 5 menit terakhir. Skip.');
              process.exit(0);
            }

            console.log(`Pesan baru ditemukan: "${msgText}" dari ${msgIp}`);

            // Cek _notify_state/last untuk anti-duplikasi
            const stateUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/_notify_state/last?key=${API_KEY}`;
            const stateRes = await httpsRequest(stateUrl, { method: 'GET' }, null);

            let lastNotifiedTs = 0;
            if (stateRes.status === 200 && stateRes.body.fields) {
              lastNotifiedTs = parseInt(stateRes.body.fields.ts?.integerValue || '0');
            }

            if (msgTs <= lastNotifiedTs) {
              console.log(`Pesan ts=${msgTs} sudah pernah dinotif (lastNotifiedTs=${lastNotifiedTs}). Skip.`);
              process.exit(0);
            }

            // Kirim ke /api/notify.js di Vercel
            const notifyUrl = new URL(NOTIFY_URL);
            const notifyRes = await httpsRequest(
              notifyUrl,
              {
                method: 'POST',
                headers: {
                  'Content-Type':    'application/json',
                  'x-notify-secret': SECRET,
                },
              },
              JSON.stringify({ ip: msgIp, text: msgText, ts: msgTs })
            );

            if (notifyRes.status !== 200) {
              console.error('Notify gagal:', notifyRes.status, JSON.stringify(notifyRes.body));
              process.exit(0);
            }

            console.log('Push terkirim via OneSignal:', JSON.stringify(notifyRes.body));

            // Update _notify_state/last di Firestore (PATCH)
            const patchUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/_notify_state/last?key=${API_KEY}&updateMask.fieldPaths=ts`;
            await httpsRequest(
              patchUrl,
              { method: 'PATCH', headers: { 'Content-Type': 'application/json' } },
              JSON.stringify({ fields: { ts: { integerValue: String(msgTs) } } })
            );

            console.log(`State diupdate: lastNotifiedTs=${msgTs}`);
          }

          main().catch(err => {
            console.error('Error:', err);
            process.exit(0); // Jangan fail workflow supaya tidak flood email notif
          });
          EOF
