<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>DASHMIN — SMK Nurul Falah</title>
    <link rel="stylesheet" href="assets/style/variable.css">
    <link rel="stylesheet" href="assets/style/dashmin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashmin-body">
    <nav class="dashmin-nav">
        <span class="dashmin-nav-title">DASHMIN</span>
        <span class="dashmin-nav-user" id="dashmin-nav-user"></span>
        <button class="dashmin-logout-btn" id="dashmin-logout-btn" type="button">Keluar</button>
    </nav>

    <div class="dashmin-gate" id="dashmin-gate">
        <div class="dashmin-gate-icon">🛡️</div>
        <p id="dashmin-gate-text">Memuat...</p>
        <button class="dashmin-btn" id="dashmin-gate-btn" type="button" hidden>Login dengan Google</button>
    </div>

    <main class="dashmin-main" id="dashmin-dashboard" hidden>
        <div class="dashmin-stats" id="dashmin-stats">
            <div class="dashmin-stat">
                <span class="dashmin-stat-value" id="dashmin-stat-pending">—</span>
                <span class="dashmin-stat-label">Pending</span>
            </div>
            <div class="dashmin-stat">
                <span class="dashmin-stat-value" id="dashmin-stat-members">—</span>
                <span class="dashmin-stat-label">Member</span>
            </div>
            <div class="dashmin-stat">
                <span class="dashmin-stat-value">8</span>
                <span class="dashmin-stat-label">Room</span>
            </div>
        </div>

        <section class="dashmin-section">
            <h2 class="dashmin-section-title" id="dashmin-pending-title">Permintaan Akses Kelas</h2>
            <div id="dashmin-pending-list"></div>
        </section>

        <section class="dashmin-section">
            <div class="dashmin-section-head">
                <h2 class="dashmin-section-title" id="dashmin-members-title">Member per Kelas</h2>
                <div class="dashmin-search">
                    <span class="dashmin-search-icon">🔍</span>
                    <input type="text" id="dashmin-member-search" class="dashmin-search-input" placeholder="Cari nama atau email member..." autocomplete="off">
                    <button type="button" class="dashmin-search-clear" id="dashmin-member-search-clear" hidden aria-label="Bersihkan pencarian">✕</button>
                </div>
            </div>
            <div id="dashmin-members-list"></div>
        </section>
    </main>

    <script src="assets/logic/dashmin-app.js"></script>
</body>
</html>
