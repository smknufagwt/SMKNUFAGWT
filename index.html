        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch {
            position: relative; color: var(--neon); font-size: 2rem; 
            letter-spacing: 3px; font-weight: bold; text-transform: uppercase;
            transition: color 0.5s;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
        }
        .glitch::before {
            left: 2px; text-shadow: -1px 0 var(--glitch-red); clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -1px 0 var(--glitch-blue); clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.5deg); }
            20% { clip: rect(80px, 9999px, 100px, 0); transform: skew(0.3deg); }
            40% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.8deg); }
            60% { clip: rect(50px, 9999px, 20px, 0); transform: skew(0.2deg); }
            80% { clip: rect(20px, 9999px, 90px, 0); transform: skew(0.6deg); }
            100% { clip: rect(90px, 9999px, 10px, 0); transform: skew(0.4deg); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 10px, 0); transform: skew(0.8deg); }
            20% { clip: rect(20px, 9999px, 40px, 0); transform: skew(0.2deg); }
            40% { clip: rect(90px, 9999px, 30px, 0); transform: skew(0.6deg); }
            60% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.4deg); }
            80% { clip: rect(50px, 9999px, 20px, 0); transform: skew(0.1deg); }
            100% { clip: rect(30px, 9999px, 70px, 0); transform: skew(0.7deg); }
        }

        .critical-error { color: red !important; text-shadow: 2px 2px 0px #000; }

        #overlay {
            position: fixed; inset: 0; background: black; z-index: 100;

        .btn-enter {

        .marquee-container {
            border-top: 2px solid var(--neon); border-bottom: 2px solid var(--neon);

            position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 70%; max-width: 260px; height: 20px;
            display: flex; align-items: flex-start; justify-content: center; gap: 18px;
            pointer-events: none; z-index: 3;
        }
        .petir-bolt {
            width: 4px; height: 100%;
            background: linear-gradient(180deg, transparent, var(--neon) 35%, #fff 55%, var(--neon) 100%);
            clip-path: polygon(50% 0%, 100% 18%, 55% 42%, 100% 58%, 35% 100%, 45% 58%, 0% 42%, 45% 18%);
            filter: drop-shadow(0 0 4px var(--neon)) drop-shadow(0 0 10px var(--neon));
            opacity: 0;
            animation-name: petir-flash;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-duration: var(--petir-dur, 3.2s);
            animation-delay: var(--petir-delay, 0s);
        }
        @keyframes petir-flash {
            0%, 90%, 100% { opacity: 0; }
            91% { opacity: 1; }
            92.5% { opacity: 0.15; }
            94% { opacity: 0.9; }
            96% { opacity: 0; }
        }
        .marquee-content {
            display: inline-block; padding-left: 100%;
            animation: scroll-text 13s linear infinite;
            font-size: 1.1rem; font-weight: bold; letter-spacing: 3px; color: white;
            text-shadow: 0 0 5px var(--neon);
        }
        @keyframes scroll-text { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .slide {
            display: none; background: var(--glass); border: 1px solid var(--neon-dim);
            padding: 30px; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.05); line-height: 1.6; position: relative;
            transition: border-color 0.5s;

        }
        
        .slide-hud {
            position: absolute; top: 5px; right: 10px;
            font-size: 0.6rem; color: var(--neon); opacity: 0.8;
            letter-spacing: 2px; transition: color 0.5s;
        }

        .slide.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { 
            border-bottom: 2px solid var(--neon); padding-bottom: 10px; 
            margin-top: 0; font-size: 1.5rem; color: white; margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-dim);
            transition: border-color 0.5s, text-shadow 0.5s;
        }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .gallery-item {
            border: 1px solid var(--neon-dim); position: relative; height: 180px; overflow: hidden;
            transition: 0.3s; background: #000; cursor: pointer;
        }
        .gallery-item:hover { border-color: var(--neon); transform: scale(1.02); z-index: 2; box-shadow: 0 0 20px var(--neon-dim); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 0.3s; filter: grayscale(80%); }
        .gallery-item:hover img { opacity: 1; filter: grayscale(0%); }
        .caption {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.9);
            color: var(--neon); font-size: 0.7rem; padding: 8px; text-align: center; border-top: 1px solid var(--neon-dim);
            font-weight: bold; letter-spacing: 1px; transition: color 0.5s, border-color 0.5s;

        .comp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .comp-btn {
            padding: 15px; border: 1px solid var(--neon-dim); background: rgba(0,0,0,0.6); 
            color: var(--neon); cursor: pointer; font-family: var(--font-main); font-weight: bold; font-size: 0.9rem;
            transition: 0.2s; text-align: left;
        }
        .comp-btn:hover { background: rgba(0, 255, 65, 0.1); border-color: var(--neon); }
        .comp-btn.active-comp { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }
        .desc-box {

        footer { text-align: center; margin-top: 60px; padding: 20px; border-top: 1px solid var(--neon-dim); color: #666; font-size: 0.8rem; transition: border-color 0.5s; }

            transition: 0.3s; text-transform: uppercase; background: #000;
        }
        .author-link:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); transform: translateY(-3px); }
        
        .control-btn {
            position: fixed; bottom: 29px; width: 45px; height: 45px;
            border: 1px solid var(--neon); background: rgba(0, 0, 0, 0.8); color: var(--neon);

            background: var(--glitch-red); border-radius: 50%; box-shadow: 0 0 8px var(--glitch-red);
            display: none;
        }

        #chat-marquee-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
            background: linear-gradient(90deg, rgba(0,0,0,0.95), var(--glass), rgba(0,0,0,0.95));

            overflow: hidden; z-index: 999; display: none; align-items: center;

        #chat-marquee-bar.live { display: flex; }
        #chat-marquee-track {

        #chat-panel {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
            width: min(92vw, 380px); max-height: 70vh; z-index: 1100;
            background: var(--glass); border: 1px solid var(--neon); border-bottom: none;

            display: flex; flex-direction: column; transition: transform 0.35s ease;
            backdrop-filter: blur(6px);
        }
        #chat-panel.open { transform: translateX(-50%) translateY(0%); }
        #chat-panel-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border-bottom: 1px solid var(--neon-dim);

        #chat-panel-head .chat-status { font-size: 0.65rem; opacity: 0.7; }
        #chat-panel-head .chat-status .dot {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;

        #chat-close { background: none; border: none; color: var(--neon); font-size: 1rem; cursor: pointer; }
        #chat-messages {

        }
        #chat-input:focus { border-color: var(--neon); box-shadow: 0 0 8px var(--neon-dim); }
        #chat-send {
            background: var(--neon-dim); border: none; color: #000; font-weight: bold;
            padding: 0 14px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        #chat-send:hover { background: var(--neon); box-shadow: 0 0 10px var(--neon); }
        #chat-send:disabled, #chat-send.cooldown {
            background: #222; color: var(--neon-dim); cursor: not-allowed; opacity: 0.6; box-shadow: none;
        }
        #chat-send.cooldown::after {
            content: attr(data-cd); font-size: 0.6rem; margin-left: 4px;
        }

        .privacy-wrap { position: relative; display: inline-block; }

            color: var(--neon); text-decoration: none; font-weight: bold;
            border: 1px solid var(--neon); padding: 8px 15px; display: inline-block; margin-bottom: 10px;
            transition: 0.3s; text-transform: uppercase; background: #000; font-family: var(--font-main);
            cursor: pointer; font-size: 0.8rem;
        }
        .privacy-link:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); transform: translateY(-3px); }

        #system-log { 
            color: var(--neon) !important;

    <div id="chat-marquee-bar"></div>
    <div id="chat-panel"></div>

    <!-- ⚡ PERFORMANCE: Load inline essential scripts, defer heavy logic -->
    <script>
    (function() {
        'use strict';

        // ⚡ PERFORMANCE: Minimal configuration for startup
        const NOTIFY_ENDPOINT = '/api/notify';
        const NOTIFY_SECRET = '%%NOTIFY_SECRET%%';
        const THROTTLE_MS = 10000;
        const FETCH_TIMEOUT_MS = 6000;
        const MAX_RETRY = 2;

        let lastTriggeredTs = 0;
        let lastTriggerTime = 0;
        let _oneSignalReady = false;

        // ⚡ PERFORMANCE: OneSignal init deferred
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            try {
                await OneSignal.init({
                    appId: '24018ed8-5d9e-4e5e-b651-f8e94bf58a53',
                    safari_web_id: 'web.onesignal.auto.5a4f7f6e-eec9-48b6-8a5c-3683e8870b3c',
                    notifyButton: { enable: false },
                    serviceWorkerParam: { scope: '/' },
                    serviceWorkerPath: '/sw.js',
                });
                _oneSignalReady = true;
            } catch(e) {
                console.warn('[NufaNotify] OneSignal init failed:', e.message);
            }
        });

        async function fetchWithRetry(url, options, retries) {
            for(let i = 0; i <= retries; i++) {
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
                try {
                    const res = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(tid);
                    return res;
                } catch(e) {
                    clearTimeout(tid);
                    if(i === retries) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
        }

        window.NufaNotify = {
            async trigger(m) {
                if(!m || !m.text || !m.ts) return;
                if(m.ts <= lastTriggeredTs) return;
                const now = Date.now();
                if(now - lastTriggerTime < THROTTLE_MS) return;
                lastTriggeredTs = m.ts;
                lastTriggerTime = now;

                if(navigator.onLine) {
                    try {
                        await fetchWithRetry(
                            NOTIFY_ENDPOINT,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'x-notify-secret': NOTIFY_SECRET },
                                body: JSON.stringify({ ip: m.ip, text: m.text, ts: m.ts }),
                            },
                            MAX_RETRY
                        );
                    } catch(e) {
                        console.warn('[NufaNotify] Failed:', e.message);
                    }
                }
            },

            async requestPermission() {
                if(!_oneSignalReady) return false;
                try {
                    await OneSignal.Notifications.requestPermission();
                    return OneSignal.Notifications.permission;
                } catch(e) {
                    return false;
                }
            },

            async isSubscribed() {
                if(!_oneSignalReady) return false;
                try { return !!(await OneSignal.User.PushSubscription.optedIn); }
                catch { return false; }
            }
        };
    })();
    </script>

    <!-- ⚡ PERFORMANCE: Load main app logic deferred -->
    <script defer src="app-logic.js"></script>
</body>
